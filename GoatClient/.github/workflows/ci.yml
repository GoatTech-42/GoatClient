name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Java payload
        shell: pwsh
        run: |
          cd GoatClient
          ./gradlew clean build verifyInjectionPayload --no-daemon --stacktrace

      - name: Upload injection jar
        uses: actions/upload-artifact@v4
        with:
          name: goat-client-injection-jar
          path: GoatClient/build/libs/goat-client-4.22-injection.jar
